<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Centinel Settings</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <h1>Centinel Settings</h1>

    <label class="field">
      <span>Backend API URL</span>
      <input type="text" id="api-base" placeholder="http://localhost:8000" />
      <small>The same FastAPI backend the Android app talks to. Use http://localhost:8000 for local development.</small>
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="auto-block" />
      <span>Automatically block dangerous pages</span>
    </label>

    <label class="field">
      <span>Block threshold</span>
      <select id="block-threshold">
        <option value="Medium">Medium and above</option>
        <option value="High">High and above (recommended)</option>
        <option value="Critical">Critical only</option>
      </select>
      <small>Pages scoring at or above this level will be redirected to a full-page warning instead of loading.</small>
    </label>

    <button id="save-btn" class="btn primary">Save Settings</button>
    <p id="saved-note" class="saved-note hidden">Saved ✓</p>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
