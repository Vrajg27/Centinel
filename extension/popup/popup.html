<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Centinel</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" />
    <span>Centinel</span>
    <button id="settings-btn" title="Settings">⚙️</button>
  </header>

  <!-- Logged-out view -->
  <section id="auth-view" class="view hidden">
    <div class="tabs">
      <button id="tab-login" class="tab active">Log In</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit" class="btn primary">Log In</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="register-form" class="hidden">
      <input type="text" id="register-name" placeholder="Full name (optional)" />
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Password (min 8 chars)" required minlength="8" />
      <button type="submit" class="btn primary">Register</button>
      <p class="error" id="register-error"></p>
    </form>
    <p class="hint">Use the same account as the Centinel Android app to sync scan history.</p>
  </section>

  <!-- Logged-in view -->
  <section id="main-view" class="view hidden">
    <div id="current-tab-card" class="card"></div>

    <div class="scan-box">
      <input type="text" id="manual-url" placeholder="Scan any URL manually…" />
      <button id="manual-scan-btn" class="btn primary small">Scan</button>
    </div>
    <div id="manual-result"></div>

    <h3>Recent Scans</h3>
    <div id="recent-list"></div>

    <button id="logout-btn" class="btn text">Log out</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
